<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Guilherme Lima Tech | Engenharia de Software</title>
    <style>
        /* Estilo Deep Green (Verde Profundo) com Monstera */
        :root {
            --bg-color: #0d1b10;
            --text-color: #f2f2f2;
            --accent-light: #2c5e42;
            --accent-dark: #193220;
            --accent-bright: #68c37d;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            line-height: 1.6;
        }

        a {
            color: var(--accent-bright);
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: white;
        }

        /* Header e Navegação */
        header {
            background-color: rgba(13, 27, 16, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            font-weight: 500;
            color: var(--text-color);
        }
